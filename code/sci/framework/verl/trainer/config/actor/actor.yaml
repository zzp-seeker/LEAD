
_target_: verl.workers.config.ActorConfig

rollout_n: ${oc.select:actor_rollout_ref.rollout.n,1}

strategy: ???

ppo_mini_batch_size: 256

ppo_micro_batch_size: null

ppo_micro_batch_size_per_gpu: null

use_dynamic_bsz: false

ppo_max_token_len_per_gpu: 16384

clip_ratio: 0.2

clip_ratio_low: 0.2

clip_ratio_high: 0.2

tau_pos: 1.0

tau_neg: 1.05

freeze_vision_tower: false

policy_loss:

  _target_: verl.workers.config.PolicyLossConfig

  loss_mode: "vanilla"

  clip_cov_ratio: 0.0002

  clip_cov_lb: 1.0

  clip_cov_ub: 5.0

  kl_cov_ratio: 0.0002

  ppo_kl_coef: 0.1

self_distillation:

  _target_: verl.workers.config.SelfDistillationConfig


  full_logit_distillation: True

  distillation_topk: 100

  distillation_add_tail: True

  alpha: 0.5

  success_reward_threshold: 0.5

  teacher_regularization: ema

  teacher_update_rate: 0.05

  max_reprompt_len: 10240

  reprompt_truncation: right

  dont_reprompt_on_self_success: True

  remove_thinking_from_demonstration: True

  include_environment_feedback: True

  environment_feedback_only_without_solution: True

  is_clip: 2

  reprompt_template: |-
    {prompt}{solution}{feedback}

    Correctly solve the original question.

  solution_template: |-

    Correct solution:

    {successful_previous_attempt}

  feedback_template: |-

    The following is feedback from your unsuccessful earlier attempt:

    {feedback_raw}

  enable_reflection: False

  reflection_max_length: 4096

  reflection_prompt_max_length: 8192

  reflection_truncation: right

  reflection_model: student

  reflection_include_for_correct: True

  distill_correct_rollouts: True

  use_error_quote_mask: True

  use_reflection_in_teacher_prompt: True

  skip_distill_if_no_success: True

  skip_distill_if_all_success: False

  reflection_wrong_system_template: |-
    You are a careful tutor. Respond strictly in the required format and nothing else.

  reflection_wrong_user_template: |-
    {prompt}

    [Correct Solution]
    {correct_solution}

    [Incorrect Solution]
    {wrong_solution}

    The correct final answer is {answer}. Diagnose the [Incorrect Solution] by responding strictly in the following format:

    <error_quote>
    (Extract the EXACT substring from the [Incorrect Solution] where the reasoning first goes wrong)
    </error_quote>
    <explanation>
    (Explain the exact mistake in the quote, how to fix it, and what the correct logic is)
    </explanation>

  reflection_correct_system_template: |-
    You are a careful tutor. Respond strictly in the required format and nothing else.

  reflection_correct_user_template: |-
    {prompt}

    [Correct Solution]
    {correct_solution}

    Explain why this reasoning is valid and why the final answer should be {answer}.
    Respond strictly in the following format:
    <explanation>
    (Your explanation of why the logic is correct)
    </explanation>

  teacher_reflection_template: |-

    The following is the key idea to solve the question:

    {reflection}

  teacher_reprompt_template_with_reflection: |-
    {prompt}
    {feedback}
    {reflection}

    Correctly solve the original question.


  debug_print_prompts: False

  debug_print_num_samples: 2

  debug_print_max_chars: 4000

clip_ratio_c: 3.0

loss_agg_mode: token-mean

loss_scale_factor: null

entropy_coeff: 0

calculate_entropy: false

use_kl_loss: false

use_prefix_grouper: false

use_torch_compile: true

kl_loss_coef: 0.001

kl_loss_type: low_var_kl

ppo_epochs: 1

shuffle: false

data_loader_seed: 42

checkpoint:

  _target_: verl.trainer.config.CheckpointConfig

  save_contents: ['model', 'optimizer', 'extra']

  load_contents: ${.save_contents}

  async_save: False

optim:

  lr: 1e-6

  lr_warmup_steps_ratio: 0.0

  total_training_steps: -1

  weight_decay: 0.01

  lr_warmup_steps: -1


use_fused_kernels: ${oc.select:actor_rollout_ref.model.use_fused_kernels,false}

profiler:

  _target_: verl.utils.profiler.ProfilerConfig

  tool: ${oc.select:global_profiler.tool,null}

  enable: False

  all_ranks: False

  ranks: []

  save_path: ${oc.select:global_profiler.save_path,null}

  tool_config:

    nsys:

      _target_: verl.utils.profiler.config.NsightToolConfig

      discrete: ${oc.select:global_profiler.global_tool_config.nsys.discrete}

    npu:

      _target_: verl.utils.profiler.config.NPUToolConfig

      contents: []

      level: "level0"

      analysis: True

      discrete: False

    torch:

      _target_: verl.utils.profiler.config.TorchProfilerToolConfig

      step_start: 0

      step_end: null

    torch_memory:

      _target_: verl.utils.profiler.config.TorchMemoryToolConfig

      trace_alloc_max_entries: ${oc.select:global_profiler.global_tool_config.torch_memory.trace_alloc_max_entries,100000}

      stack_depth: ${oc.select:global_profiler.global_tool_config.torch_memory.stack_depth,32}

router_replay:

  _target_: verl.workers.config.RouterReplayConfig

  mode: disabled

  record_file: null

  replay_file: null
