defaults:
  - actor@actor_rollout_ref.actor: megatron_actor
  - data@data: legacy_data
  - reward_manager@reward_manager
  - ref@actor_rollout_ref.ref: megatron_ref
  - rollout@actor_rollout_ref.rollout: rollout
  - model@actor_rollout_ref.model: hf_model
  - critic@critic: megatron_critic
  - reward_model@reward_model: megatron_reward_loop
  - algorithm@algorithm.rollout_correction: rollout_correction
  - _self_

actor_rollout_ref:
  hybrid_engine: True

  nccl_timeout: 600

  model:
    override_config:
      model_config: {}
      moe_config:
        freeze_moe_router: False

    use_fused_kernels: False

    trust_remote_code: False

    use_remove_padding: false

    lora:
      type: lora

      rank: 0

      alpha: 32

      dropout: 0.0

      target_modules:
        - linear_qkv
        - linear_proj
        - linear_fc1
        - linear_fc2

      exclude_modules: []

      dropout_position: pre

      lora_A_init_method: xavier

      lora_B_init_method: zero

      a2a_experimental: False

      dtype: null

      adapter_path: null

      freeze_vision_model: True
      freeze_vision_projection: True
      freeze_language_model: True

  rollout:
    quantization: null

    layer_name_map:
      qkv_layer_name: qkv
      gate_proj_layer_name: gate_up

custom_reward_function:
  path: null
  name: compute_score

algorithm:
  _target_: verl.trainer.config.AlgoConfig
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  kl_penalty: kl
  kl_ctrl:
    _target_: verl.trainer.config.KLControlConfig
    type: fixed
    kl_coef: 0.001
    horizon: 10000
    target_kl: 0.1
  use_pf_ppo: False
  pf_ppo:
    reweight_method: pow
    weight_pow: 2.0

trainer:
  balance_batch: True
  total_epochs: 30
  total_training_steps: null
  project_name: verl_examples
  experiment_name: gsm8k
  logger: ["console", "wandb"]
  log_val_generations: 0
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  esi_redundant_time: 0

  resume_mode: auto
  resume_from_path: null
  del_local_ckpt_after_load: False
  val_before_train: True
  test_freq: -1
  critic_warmup: 0
  default_hdfs_dir: null
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  ray_wait_register_center_timeout: 300
  device: cuda
  rollout_data_dir: null

  use_legacy_worker_impl: auto

global_profiler:
  _target_: verl.utils.profiler.ProfilerConfig
  tool: null
  steps: null
  profile_continuous_steps: False
  save_path: "outputs/profile"
  global_tool_config:
    nsys:
      discrete: False

      controller_nsight_options:
        trace: "cuda,nvtx,cublas,ucx"

        cuda-memory-usage: "true"

        cuda-graph-trace: "graph"

      worker_nsight_options:
        trace: "cuda,nvtx,cublas,ucx"

        cuda-memory-usage: "true"

        cuda-graph-trace: "graph"

        capture-range: "cudaProfilerApi"

        capture-range-end: null

        kill: none

    torch_memory:
      trace_alloc_max_entries: 100_000
      stack_depth: 32
      context: "all"
      stacks: "all"
      kw_args: {}

transfer_queue:
  enable: False

ray_kwargs:
  ray_init:
    num_cpus: null
  timeline_json_file: null
